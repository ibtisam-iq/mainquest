<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="card-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="card-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="card-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1c0a1a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Accents & Lines -->
    <linearGradient id="flow-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="flow-emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="flow-rose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; fill: #94a3b8; font-size: 14px; }
    .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #f8fafc; }
    .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; font-size: 11px; fill: #94a3b8; }
    .node-code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #38bdf8; }
    .badge { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; font-weight: 600; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="760" fill="url(#canvas-bg)" rx="16" />
  <rect width="1198" height="758" x="1" y="1" fill="none" stroke="#334155" stroke-opacity="0.4" rx="15" />

  <!-- Header Section -->
  <g transform="translate(50, 45)">
    <text class="title" font-size="24" y="0">MainQuest System Architecture</text>
    <text class="subtitle" y="24">Offline Normalization Pipeline • Dual-Layer Compact Payloads • Sub-5ms Client Search &amp; Programmatic SEO</text>
    
    <!-- Top Stats Badges -->
    <g transform="translate(720, -10)">
      <rect width="110" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
      <text x="55" y="18" text-anchor="middle" class="badge" fill="#38bdf8">13,542 Entities</text>
      
      <rect x="120" width="105" height="28" rx="14" fill="#065f46" fill-opacity="0.3" stroke="#059669" stroke-width="1"/>
      <text x="172" y="18" text-anchor="middle" class="badge" fill="#34d399">1.18 MB Gzip</text>

      <rect x="235" width="140" height="28" rx="14" fill="#581c87" fill-opacity="0.3" stroke="#9333ea" stroke-width="1"/>
      <text x="305" y="18" text-anchor="middle" class="badge" fill="#c084fc">316 Landing Pages</text>
    </g>
  </g>

  <!-- ==================== SECTION 1: INGESTION PIPELINE (TOP) ==================== -->
  <g transform="translate(50, 105)">
    <!-- Container Box -->
    <rect width="1100" height="135" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <text x="24" y="26" class="section-title" fill="#38bdf8">1. Offline Ingestion &amp; Quality Audit Pipeline (scripts/ingest/)</text>

    <!-- Node 1: Raw Records -->
    <g transform="translate(24, 42)">
      <rect width="210" height="72" rx="8" fill="url(#card-blue)" stroke="#475569" stroke-width="1" filter="url(#card-shadow)"/>
      <text x="16" y="26" class="node-title">Corporate Master Records</text>
      <text x="16" y="44" class="node-desc">13,542 Companies • Multi-office</text>
      <text x="16" y="60" class="node-code">data/raw/companies.csv</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 234 78 L 268 78" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3" />

    <!-- Node 2: Address Normalizer -->
    <g transform="translate(270, 42)">
      <rect width="240" height="72" rx="8" fill="url(#card-blue)" stroke="#0284c7" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="16" y="26" class="node-title">Address &amp; Place Normalizer</text>
      <text x="16" y="44" class="node-desc">26 Cities • 201 Commercial Areas</text>
      <text x="16" y="60" class="node-code">scripts/ingest/offices.ts</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 510 78 L 544 78" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3" />

    <!-- Node 3: Classifier -->
    <g transform="translate(546, 42)">
      <rect width="240" height="72" rx="8" fill="url(#card-blue)" stroke="#0284c7" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="16" y="26" class="node-title">Origin &amp; Taxon Classifier</text>
      <text x="16" y="44" class="node-desc">Local vs Overseas vs Global</text>
      <text x="16" y="60" class="node-code">scripts/ingest/classify.ts</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 786 78 L 820 78" stroke="#c084fc" stroke-width="2" />

    <!-- Node 4: Validation Gate -->
    <g transform="translate(822, 42)">
      <rect width="254" height="72" rx="8" fill="url(#card-indigo)" stroke="#818cf8" stroke-width="2" filter="url(#card-shadow)"/>
      <text x="16" y="26" class="node-title">Pre-Build Verification Gate</text>
      <text x="16" y="44" class="node-desc">Zero Data Leaks • Byte Budgets</text>
      <text x="16" y="60" class="node-code">scripts/validate.ts</text>
    </g>
  </g>

  <!-- Connecting Trunk Arrows from Ingestion to Storage & SSG -->
  <path d="M 949 240 L 949 270 L 320 270 L 320 290" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M 949 240 L 949 270 L 870 270 L 870 290" fill="none" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- ==================== MIDDLE ROW: COMPACT PAYLOADS & STATIC SSG ==================== -->

  <!-- SECTION 2: DUAL STATIC PAYLOADS (MIDDLE LEFT) -->
  <g transform="translate(50, 290)">
    <rect width="530" height="155" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <text x="24" y="26" class="section-title" fill="#34d399">2. Compact Compressed Payloads (public/data/)</text>

    <!-- Core Payload -->
    <g transform="translate(24, 42)">
      <rect width="230" height="92" rx="8" fill="url(#card-emerald)" stroke="#34d399" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="16" y="26" class="node-title">core.json.gz (579 KB)</text>
      <text x="16" y="44" class="node-desc">Immediate Startup Load</text>
      <text x="16" y="62" class="node-desc">Names • Coordinates • Followers</text>
      <text x="16" y="80" class="node-code">public/data/core.json.gz</text>
    </g>

    <!-- Extra Payload -->
    <g transform="translate(276, 42)">
      <rect width="230" height="92" rx="8" fill="url(#card-emerald)" stroke="#059669" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="16" y="26" class="node-title">extra.json.gz (605 KB)</text>
      <text x="16" y="44" class="node-desc">Lazy Load on Facet Expand</text>
      <text x="16" y="62" class="node-desc">Specialties • Members • Websites</text>
      <text x="16" y="80" class="node-code">public/data/extra.json.gz</text>
    </g>
  </g>

  <!-- SECTION 3: PROGRAMMATIC SEO & SSG (MIDDLE RIGHT) -->
  <g transform="translate(620, 290)">
    <rect width="530" height="155" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <text x="24" y="26" class="section-title" fill="#fb7185">3. Programmatic SEO Engine (Next.js 16 SSG)</text>

    <!-- Node: SSG Routes -->
    <g transform="translate(24, 42)">
      <rect width="230" height="92" rx="8" fill="url(#card-rose)" stroke="#f43f5e" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="16" y="26" class="node-title">316 Landing Pages</text>
      <text x="16" y="44" class="node-desc">Cities • Areas • Verticals</text>
      <text x="16" y="62" class="node-desc">174 Canonical Sitemap URLs</text>
      <text x="16" y="80" class="node-code">app/companies/ &amp; /industry/</text>
    </g>

    <!-- Node: Dynamic OG Cards -->
    <g transform="translate(276, 42)">
      <rect width="230" height="92" rx="8" fill="url(#card-rose)" stroke="#e11d48" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="16" y="26" class="node-title">174 Social Preview Cards</text>
      <text x="16" y="44" class="node-desc">Dynamic OpenGraph Images</text>
      <text x="16" y="62" class="node-desc">Ahead-of-Time Build (@vercel/og)</text>
      <text x="16" y="80" class="node-code">opengraph-image.tsx</text>
    </g>
  </g>

  <!-- Connecting Trunk Arrows to Bottom Section -->
  <path d="M 315 445 L 315 475 L 380 475 L 380 495" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M 885 445 L 885 475 L 820 475 L 820 495" fill="none" stroke="#a855f7" stroke-width="2.5" />

  <!-- ==================== SECTION 4: CLIENT-SIDE EXECUTION ENGINE (BOTTOM) ==================== -->
  <g transform="translate(50, 495)">
    <rect width="1100" height="230" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <text x="24" y="26" class="section-title" fill="#38bdf8">4. Zero-Latency Browser Runtime Engine (Client-Side)</text>

    <!-- Worker Sub-Card -->
    <g transform="translate(24, 40)">
      <rect width="320" height="168" rx="8" fill="url(#card-purple)" stroke="#a855f7" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="16" y="26" class="node-title">Background Search Worker</text>
      <text x="16" y="46" class="node-desc">Prefix Trie Search Index</text>
      <text x="16" y="64" class="node-desc">Typo-Tolerant Synonym Matching</text>
      <text x="16" y="82" class="node-desc">Sub-Millisecond Token Queries</text>
      <text x="16" y="102" class="node-code">components/search.worker.ts</text>
      <text x="16" y="122" class="node-code">lib/search-index.ts</text>
      <rect x="16" y="136" width="120" height="20" rx="10" fill="#6b21a8" fill-opacity="0.6"/>
      <text x="76" y="150" text-anchor="middle" class="badge" fill="#e9d5ff">Zero UI Jitter</text>
    </g>

    <!-- Query Engine Sub-Card -->
    <g transform="translate(370, 40)">
      <rect width="330" height="168" rx="8" fill="url(#card-blue)" stroke="#0284c7" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="16" y="26" class="node-title">In-Memory Query Engine</text>
      <text x="16" y="46" class="node-desc">Compound Facet Aggregation</text>
      <text x="16" y="64" class="node-desc">Specialties ANY/ALL Conjunction</text>
      <text x="16" y="82" class="node-desc">Haversine Geospatial Radius Filter</text>
      <text x="16" y="102" class="node-desc">Two-Way URL State Sync (?q=...)</text>
      <text x="16" y="122" class="node-code">lib/query.ts &amp; lib/payload.ts</text>
      <rect x="16" y="136" width="130" height="20" rx="10" fill="#0369a1" fill-opacity="0.6"/>
      <text x="81" y="150" text-anchor="middle" class="badge" fill="#bae6fd">&lt; 5ms Multi-Filter</text>
    </g>

    <!-- UI & Edge Delivery Sub-Card -->
    <g transform="translate(725, 40)">
      <rect width="350" height="168" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="16" y="26" class="node-title">Interactive UI &amp; Edge Delivery</text>
      <text x="16" y="46" class="node-desc">DirectoryShell &amp; Faceted Drawer</text>
      <text x="16" y="64" class="node-desc">MapLibre GL Vector Dot Maps</text>
      <text x="16" y="82" class="node-desc">Instant Client CSV &amp; JSON Export</text>
      <text x="16" y="102" class="node-code">components/Directory.tsx &amp; DotMap.tsx</text>
      <text x="16" y="122" class="node-code">Hosted on Vercel Edge CDN</text>
      <rect x="16" y="136" width="170" height="20" rx="10" fill="#065f46" fill-opacity="0.6"/>
      <text x="101" y="150" text-anchor="middle" class="badge" fill="#a7f3d0">mainquest.ibtisam-iq.com</text>
    </g>
  </g>
</svg>
